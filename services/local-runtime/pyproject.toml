[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "friday-local-runtime"
version = "0.1.0"
description = "Local model workers for Friday's macOS voice assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
  "laya-coreml==0.2.0",
  "moonshine-voice==0.1.5",
  "huggingface-hub>=0.33,<2",
]

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/friday_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
